name: Vérifier PlantBot 0.6.0

on:
  workflow_dispatch:
  push:
    paths:
      - PlantBot-v0.6.0.patch
      - .github/workflows/verify-plantbot-0.6.0.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PlantBot-source-v0.5.0.zip
      - run: patch -p1 -d PlantBot -i "$GITHUB_WORKSPACE/PlantBot-v0.6.0.patch"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Vérifier la compilation Android
        env:
          PLANTBOT_KEYSTORE_PASSWORD: debug-only-placeholder
        run: gradle -p PlantBot :app:assembleDebug
      - name: Construire l'APK release non signé
        env:
          PLANTBOT_KEYSTORE_PASSWORD: debug-only-placeholder
        run: |
          sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = null/' PlantBot/app/build.gradle.kts
          gradle -p PlantBot :app:assembleRelease
          cp "$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)" PlantBot/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: PlantBot-0.6.0-unsigned
          path: PlantBot/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner
          path: PlantBot/apksigner.jar
          if-no-files-found: error
