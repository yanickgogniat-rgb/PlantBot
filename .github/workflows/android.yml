name: Construire PlantBot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extraire PlantBot
        run: unzip -o PlantBot-source-v0.5.0.zip

      - name: Préparer la version 0.5.1
        run: |
          sed -i '1i import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n' PlantBot/app/build.gradle.kts
          sed -i 's/kotlinOptions { jvmTarget = "17" }/kotlin { compilerOptions { jvmTarget.set(JvmTarget.JVM_17) } }/' PlantBot/app/build.gradle.kts
          sed -i 's/versionCode = 12/versionCode = 13/' PlantBot/app/build.gradle.kts
          sed -i 's/versionName = "0.5.0"/versionName = "0.5.1"/' PlantBot/app/build.gradle.kts
          sed -i 's|aiError = "L’IA n’a pas pu répondre. Vérifiez Internet et réessayez."|aiError = "Erreur IA : ${it.message ?: it::class.simpleName}"|' PlantBot/app/src/main/java/ch/yanick/plantbot/MainActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restaurer la clé permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.PLANTBOT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > PlantBot/plantbot-release.jks

      - name: Compiler l’APK signé
        env:
          PLANTBOT_KEYSTORE_PASSWORD: "PlantBot-2026-Signature!"
        run: gradle -p PlantBot :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: PlantBot-APK
          path: PlantBot/app/build/outputs/apk/release/app-release.apk
